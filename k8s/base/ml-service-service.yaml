# Headless-adjacent but not actually headless (clusterIP left default) —
# ml-service is single-replica (see ml-service-deployment.yaml), so
# there's no load-balancing decision for this Service to make; a normal
# ClusterIP Service is simpler than a headless one and works identically
# at replicas: 1.
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: financial-ai-platform
spec:
  selector:
    app: ml-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics
