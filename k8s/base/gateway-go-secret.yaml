# Placeholder values only — config.go's Load() itself refuses to start
# with GATEWAY_ENVIRONMENT=production (set in gateway-go-configmap.yaml)
# if GATEWAY_JWT_SECRET or GATEWAY_ADMIN_PASSWORD still match the
# insecure defaults below, so this file can't accidentally reach a real
# cluster without being overridden — but override it before applying
# to anything that isn't a throwaway local cluster regardless: commit a
# real secret here, or (better) generate this via your cluster's secret
# manager (Sealed Secrets, External Secrets Operator, etc.) instead of
# checking plaintext into git at all. `stringData` (not `data`) so the
# placeholders are readable in a diff — Kubernetes base64-encodes them
# into `data` itself on apply.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-go-secret
  namespace: financial-ai-platform
type: Opaque
stringData:
  GATEWAY_JWT_SECRET: "dev-insecure-secret-change-me"
  GATEWAY_ADMIN_PASSWORD: "dev-insecure-admin-change-me"
