# Placeholder credentials, same caveat as gateway-go-secret.yaml: replace
# before applying to anything but a throwaway cluster. Provisioned
# alongside postgres.yaml but not yet read by gateway-go — see
# k8s/README.md for why (auth.UserRepository et al. are still the
# in-memory implementations).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: financial-ai-platform
type: Opaque
stringData:
  POSTGRES_DB: "financial_ai_platform"
  POSTGRES_USER: "financial_ai_platform"
  POSTGRES_PASSWORD: "financial_ai_platform_dev_password"
