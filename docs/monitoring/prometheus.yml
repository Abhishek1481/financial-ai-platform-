# Prometheus scrape config for local development — both services expose
# Prometheus exposition format on a metrics port separate from their real
# traffic (see gateway-go/README.md and ml-service/README.md's Phase 14
# sections for why). Wire this into the Docker Compose stack's prometheus
# service once that lands (Phase 16); until then, `prometheus --config.file
# docs/monitoring/prometheus.yml` against locally-running processes works
# as-is.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-go
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ml-service
    static_configs:
      - targets: ["localhost:9091"]
