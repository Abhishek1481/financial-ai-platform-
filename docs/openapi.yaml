openapi: 3.0.3
info:
  title: Financial Intelligence AI Platform — gateway-go API
  description: >
    The platform's only public-facing API (see /docs/ARCHITECTURE.md for
    why gateway-go, not ml-service, owns the public surface — ml-service
    is gRPC-only, never directly reachable). Generated by hand against
    the actual handlers in gateway-go/internal/handlers, not
    auto-extracted — kept in sync manually as the source of truth for
    what a client should expect, validated with openapi-spec-validator
    (see docs/README.md's note on how, and its limits: this proves the
    document is a structurally valid OpenAPI 3.0 spec, not that every
    handler's actual behavior matches it byte-for-byte).
  version: "1.0"
  license:
    name: MIT
    url: https://github.com/Abhishek1481/financial-ai-platform-/blob/master/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development (see gateway-go/README.md's Setup section)
  - url: http://localhost:8080
    description: Docker Compose stack (see /docker-compose.yml)

tags:
  - name: auth
  - name: documents
  - name: search
  - name: rag
  - name: admin
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Never checks a downstream dependency — proves only that this process is up.
      security: []
      responses:
        "200":
          description: The process is alive.

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Aggregates downstream health checks (ml-service today).
      security: []
      responses:
        "200":
          description: All registered readiness checks passed.
        "503":
          description: At least one readiness check failed.

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: Always assigns role "user" — there is no self-service path to becoming admin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid email or a password under 8 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A user with this email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer, description: seconds }
        "401":
          description: Invalid credentials — the same error whether the email doesn't exist or the password is wrong (deliberate, see gateway-go/README.md's design decisions).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: The authenticated caller's own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/documents:
    post:
      tags: [documents]
      summary: Upload a document for extraction and embedding
      description: >
        202 with status "pending" starts an async pipeline (extraction, then
        embedding — see GET /api/v1/documents/{id} to poll it). Identical
        content (by SHA-256) reuses the existing document instead of
        re-processing, returning 200 with reused=true instead of 202.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                category: { type: string, enum: [general, sec_filing], default: general }
      responses:
        "202":
          description: Accepted — a new extraction/embedding job was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "200":
          description: Identical content already existed — reused, not re-processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: Unsupported file type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The ingestion worker queue is full — retry shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/documents/{id}:
    get:
      tags: [documents]
      summary: Get a document and its processing job status
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/documents/{id}/summary:
    get:
      tags: [rag]
      summary: Generate a summary of a document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: type
          in: query
          schema:
            type: string
            enum: [executive, risk, revenue, sentiment]
            default: executive
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummarizeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The document has no embedded chunks (upload/embedding hasn't completed, or failed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/search:
    get:
      tags: [search]
      summary: Semantic, keyword, or hybrid search over embedded chunks
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: string, enum: [semantic, keyword, hybrid], default: hybrid }
        - name: top_k
          in: query
          schema: { type: integer, default: 10, minimum: 1 }
        - name: tickers
          in: query
          description: Comma-separated, e.g. "AAPL,TSLA"
          schema: { type: string }
        - name: filing_types
          in: query
          description: Comma-separated, e.g. "10-K,10-Q"
          schema: { type: string }
        - name: fiscal_period
          in: query
          schema: { type: string, example: "FY2025-Q1" }
      responses:
        "200":
          description: OK — results may be served from cache (see internal/cache, up to GATEWAY_SEARCH_CACHE_TTL old).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/rag/query:
    post:
      tags: [rag]
      summary: Ask a question over embedded documents, streamed token-by-token
      description: >
        Response is `text/event-stream` (Server-Sent Events), not a single
        JSON body — OpenAPI 3.0 has no native SSE modeling, so the schema
        below documents the *shape of each event's data payload* rather than
        the overall response body. Events, in order: zero or more "token"
        events, then exactly one "final" event (or one "error" event instead,
        terminating the stream early).

        Conversation memory is server-side, keyed by session_id: omit it and
        one is minted and returned in the "final" event for reuse on a
        follow-up; supplying `history` explicitly overrides that lookup for
        a caller that prefers to manage its own transcript.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                session_id: { type: string, description: "Omit to start a new session — one is minted and returned in the final event." }
                history:
                  type: array
                  items: { $ref: "#/components/schemas/ConversationTurn" }
                top_k: { type: integer, default: 10 }
                tickers: { type: array, items: { type: string } }
                filing_types: { type: array, items: { type: string } }
                fiscal_period: { type: string }
      responses:
        "200":
          description: >
            text/event-stream. Each SSE event's `data:` field is JSON shaped
            like one of: `{"token": string}` (event: token),
            RagQueryFinal (event: final), or `{"error": string}` (event: error).
          content:
            text/event-stream:
              schema:
                oneOf:
                  - type: object
                    properties: { token: { type: string } }
                  - $ref: "#/components/schemas/RagQueryFinal"
                  - type: object
                    properties: { error: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/admin/ping:
    get:
      tags: [admin]
      summary: Prove RBAC gates admin routes end-to-end
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string, example: pong } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/evaluate:
    post:
      tags: [admin]
      summary: Score a question/answer/context triple for faithfulness and hallucination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string }
                answer: { type: string }
                context: { type: array, items: { type: string } }
                ground_truth_answer: { type: string, description: "Optional — enables context_recall scoring." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluateAnswerResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List every registered user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/documents:
    get:
      tags: [admin]
      summary: List every document across every user, with job status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/jobs:
    get:
      tags: [admin]
      summary: List every processing attempt for every document
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/stats:
    get:
      tags: [admin]
      summary: Aggregate operational counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed, or expired bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not an admin.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No resource with that ID.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        created_at: { type: string, format: date-time }

    UploadResponse:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        filename: { type: string }
        status: { type: string, enum: [pending, extracting, embedding, completed, failed] }
        reused: { type: boolean }

    FinancialMetadata:
      type: object
      description: Best-effort, never authoritative — see ml-service/README.md's SEC filing extraction section.
      properties:
        ticker: { type: string }
        company_name: { type: string }
        filing_type: { type: string }
        fiscal_period: { type: string }

    JobStatus:
      type: object
      properties:
        status: { type: string, enum: [pending, extracting, embedding, completed, failed] }
        error: { type: string }
        extracted_text_preview: { type: string }
        extracted_text_length: { type: integer }
        table_count: { type: integer }
        page_count: { type: integer }
        metadata: { $ref: "#/components/schemas/FinancialMetadata" }
        chunk_count: { type: integer }
        chunks_skipped_duplicate: { type: integer }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        size_bytes: { type: integer }
        uploaded_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        job: { $ref: "#/components/schemas/JobStatus" }

    JobSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, extracting, embedding, completed, failed] }
        error: { type: string }
        chunk_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Stats:
      type: object
      properties:
        total_users: { type: integer }
        total_documents: { type: integer }
        total_jobs: { type: integer }
        jobs_by_status: { type: object, additionalProperties: { type: integer } }

    SearchResult:
      type: object
      properties:
        chunk_id: { type: string }
        document_id: { type: string, format: uuid }
        text: { type: string }
        score: { type: number, format: float }
        metadata: { $ref: "#/components/schemas/FinancialMetadata" }

    SearchResponse:
      type: object
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/SearchResult" } }
        search_latency_ms: { type: number, format: float }

    ConversationTurn:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }

    Citation:
      type: object
      properties:
        chunk_id: { type: string }
        document_id: { type: string, format: uuid }
        quote: { type: string }
        page_number: { type: integer }
        source_url: { type: string }

    TokenUsage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    RagQueryFinal:
      type: object
      properties:
        session_id: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: number, format: float }

    SummarizeResponse:
      type: object
      properties:
        summary: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        usage: { $ref: "#/components/schemas/TokenUsage" }
        latency_ms: { type: number, format: float }

    EvaluateAnswerResponse:
      type: object
      properties:
        faithfulness: { type: number, format: float, minimum: 0, maximum: 1 }
        context_precision: { type: number, format: float, minimum: 0, maximum: 1 }
        context_recall: { type: number, format: float, minimum: 0, maximum: 1, description: "0 unless ground_truth_answer was supplied in the request." }
        hallucination_score: { type: number, format: float, minimum: 0, maximum: 1, description: "1 - faithfulness. 0 = fully grounded, 1 = fully hallucinated." }
        answer_relevancy: { type: number, format: float, minimum: 0, maximum: 1 }

security:
  - bearerAuth: []
